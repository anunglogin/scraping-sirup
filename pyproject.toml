[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sirup"
version = "0.1.0"
description = "SIRUP procurement-plan collector and internal filter API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "tenacity>=8.2,<10",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "alembic>=1.13,<2",
    "sqlalchemy>=2.0,<3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "respx>=0.21,<1",
    "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sirup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"db/migrations/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Security"]
