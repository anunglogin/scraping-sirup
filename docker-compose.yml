name: sirup

x-app: &app
  image: sirup:${APP_VERSION:-0.1.0}
  build:
    context: .
  environment: &app-env
    TZ: Asia/Jakarta
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      API_DB_USER: ${API_DB_USER:?set API_DB_USER in .env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set API_DB_PASSWORD in .env}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Sized for the target server in the BRD: 2 CPU / 4 GB RAM VPS (ADR TD-06).
    # Override with the PG_* variables in .env on a bigger machine.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${PG_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_parallel_workers_per_gather=${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-2}
      - -c
      - max_parallel_workers=${PG_MAX_PARALLEL_WORKERS:-2}
      - -c
      - max_wal_size=2GB
      - -c
      - jit=off
    # Parallel queries use /dev/shm; Docker's 64 MB default is too small.
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging
    # No published port: only the containers on this network can reach it.

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  scraper:
    <<: *app
    command: ["python", "-m", "sirup.scraper", "schedule"]
    restart: unless-stopped
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TAHUN_ANGGARAN: ${TAHUN_ANGGARAN:-}
      SCRAPE_PAGE_SIZE: ${SCRAPE_PAGE_SIZE:-5000}
      SCRAPE_DELAY_SECONDS: ${SCRAPE_DELAY_SECONDS:-2}
      SCRAPE_TIME: ${SCRAPE_TIME:-02:00}
      SCRAPE_MAX_PAGES: ${SCRAPE_MAX_PAGES:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *app
    restart: unless-stopped
    environment:
      <<: *app-env
      # Read-only role created by db/init/10-api-role.sh
      DATABASE_URL: postgresql://${API_DB_USER}:${API_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      API_KEYS: ${API_KEYS:?set API_KEYS in .env}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-3000}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      SEARCH_MAX_CONCURRENT: ${SEARCH_MAX_CONCURRENT:-}
      # Trust X-Forwarded-* only from the Caddy container (fixed IP on "edge").
      FORWARDED_ALLOW_IPS: 10.89.250.2
    # Host port for local use and SSH tunnels only. Keep API_BIND=127.0.0.1;
    # from outside the server use an SSH tunnel or the "https" profile (Caddy).
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    networks:
      - default
      - edge
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    image: postgres:16
    restart: unless-stopped
    entrypoint: ["sh", "/ops/backup.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-4}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      TZ: Asia/Jakarta
    volumes:
      - ./ops/backup.sh:/ops/backup.sh:ro
      - ./backups:/backups
    logging: *logging
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    # Optional: docker compose --profile https up -d   (needs API_DOMAIN in .env)
    image: caddy:2.8.4-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:-}
    # Refuse to start without a domain instead of serving plain HTTP.
    command:
      - sh
      - -c
      - >-
        [ -n "$$API_DOMAIN" ] || { echo "API_DOMAIN is not set in .env" >&2; exit 1; };
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: 10.89.250.2
    logging: *logging
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
  # Small private network between Caddy and the API; the fixed address lets
  # uvicorn trust forwarded headers from Caddy only.
  edge:
    ipam:
      config:
        - subnet: 10.89.250.0/29

volumes:
  pgdata:
  caddy_data:
  caddy_config:
